name: 发布 npm 包

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  MAIN_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true

      - name: 代码检查
        run: pnpm run lint

      - name: 类型检查
        run: pnpm run typecheck

      - name: 测试
        run: pnpm run test

      - name: 构建
        run: pnpm run build

      - name: 检查版本
        id: version
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} 已发布，跳过发布"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布
        if: github.ref_name == env.MAIN_BRANCH && steps.version.outputs.published != 'true'
        run: pnpm publish --access public
